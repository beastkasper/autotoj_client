# Reverse-proxy перед Next.js standalone-сервером (web:3000).
# TLS обычно терминируется на внешнем балансировщике/edge-nginx; здесь — HTTP.

upstream nextjs_upstream {
    server web:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Сжатие текстовых ответов
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css application/json application/javascript
        application/x-javascript text/xml application/xml application/xml+rss
        text/javascript image/svg+xml font/woff2;

    # Иммутабельная статика Next — длинный кеш
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Всё остальное — на Node-сервер Next
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
