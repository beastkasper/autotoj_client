# Прод-стек сайта: Next.js standalone-сервер + nginx перед ним.
#   docker compose up -d --build
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Вшивается в клиентский бандл на этапе сборки.
        NEXT_PUBLIC_API_URL: https://api.autotoj.tj/v1/
    environment:
      NODE_ENV: production
      # Используется на сервере (generateMetadata и т.п.) в рантайме.
      INTERNAL_API_URL: https://api.autotoj.tj/v1
    expose:
      - "3000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
